<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for Android maskable cropping -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Content scaled inside 80% safe zone circle (scale 0.76, centered) -->
  <g transform="translate(61, 61) scale(0.76)">
    <!-- Open Book -->
    <path d="M120 330 C180 300, 240 315, 256 335 C272 315, 332 300, 392 330 L392 210 C332 180, 272 195, 256 215 C240 195, 180 180, 120 210 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M256 215 L256 335" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Graduation Cap -->
    <polygon points="256,105 380,155 256,205 132,155" fill="url(#goldGradMask)" />
    <polygon points="256,190 340,165 340,205 256,235 172,205 172,165" fill="#b45309" fill-opacity="0.9" />
    <!-- Tassel -->
    <path d="M360 160 L376 220 C376 230, 368 235, 365 240" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <circle cx="365" cy="242" r="6" fill="#f59e0b" />

    <!-- Attendance Checkmark Badge -->
    <circle cx="370" cy="355" r="58" fill="url(#emeraldGradMask)" stroke="#ffffff" stroke-width="7" />
    <path d="M346 355 L364 373 L396 338" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <text x="256" y="420" font-family="system-ui, -apple-system, 'Cairo', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">مدرسة قتيبة</text>
    <text x="256" y="458" font-family="system-ui, -apple-system, 'Cairo', sans-serif" font-size="22" font-weight="700" fill="#93c5fd" text-anchor="middle">الحضور والغياب</text>
  </g>
</svg>
