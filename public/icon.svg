<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Decorative Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Central Academic Emblem & Attendance Badge -->
  <g filter="url(#shadow)">
    <!-- Open Book Base -->
    <path d="M120 330 C180 300, 240 315, 256 335 C272 315, 332 300, 392 330 L392 210 C332 180, 272 195, 256 215 C240 195, 180 180, 120 210 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M256 215 L256 335" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Graduation Cap Floating Above -->
    <polygon points="256,105 380,155 256,205 132,155" fill="url(#goldGrad)" />
    <polygon points="256,190 340,165 340,205 256,235 172,205 172,165" fill="#b45309" fill-opacity="0.9" />
    <!-- Tassel -->
    <path d="M360 160 L376 220 C376 230, 368 235, 365 240" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <circle cx="365" cy="242" r="6" fill="#f59e0b" />

    <!-- Big Checkmark Badge for Attendance (حضور) -->
    <circle cx="370" cy="355" r="58" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="7" />
    <path d="M346 355 L364 373 L396 338" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: School Identity in Arabic -->
  <text x="256" y="420" font-family="system-ui, -apple-system, 'Cairo', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">مدرسة قتيبة بن مسلم</text>
  <text x="256" y="458" font-family="system-ui, -apple-system, 'Cairo', sans-serif" font-size="20" font-weight="700" fill="#93c5fd" text-anchor="middle">نظام الحضور والغياب المدرسي</text>
</svg>
